name: Build and deploy siwek.cloud

# One pipeline, two targets:
#   - Azure Static Web Apps (primary): production on main, a preview environment per pull request.
#   - Cloudflare Workers static assets (warm standby / rollback path): main only.
# Each target deploys only when its secret exists, so this workflow is safe to merge before the cutover.
#
# The daily schedule rebuilds main so posts whose date has arrived get published.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  schedule:
    - cron: "17 5 * * *" # 05:17 UTC daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build_and_deploy:
    name: Build and deploy
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # SWA action comments the preview URL on the PR
      issues: write # open an issue when a scheduled publish fails
    env:
      SWA_ENABLED: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN != '' }}
      CF_ENABLED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: blog/package-lock.json

      - name: Install dependencies (no install scripts)
        working-directory: blog
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify npm registry signatures
        # Before any dependency code runs on this runner.
        working-directory: blog
        run: npm audit signatures

      - name: Build site
        id: build
        run: ./scripts/build-site.sh
        env:
          # Drafts and future-dated posts are visible only in PR previews.
          SHOW_DRAFTS: ${{ github.event_name == 'pull_request' && '1' || '' }}

      - name: Prepare the Azure upload
        # Azure gets its own copy without the Cloudflare-only files.
        run: |
          rm -rf dist-swa
          cp -R dist dist-swa
          rm -f dist-swa/_headers dist-swa/_redirects dist-swa/.assetsignore

      - name: Deploy to Azure Static Web Apps
        if: env.SWA_ENABLED == 'true'
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist-swa
          output_location: ""
          skip_app_build: true
          skip_api_build: true
          production_branch: main

      - name: Note skipped Azure deploy
        if: env.SWA_ENABLED != 'true'
        run: echo "::notice::AZURE_STATIC_WEB_APPS_API_TOKEN is not set, so the Azure deploy was skipped. See docs/MIGRATION.md."

      - name: Deploy to Cloudflare (standby)
        # Independent of the Azure step: a failure on either target still fails the run (and is reported),
        # but never stops the other target from getting the build.
        if: ${{ !cancelled() && steps.build.outcome == 'success' && github.event_name != 'pull_request' && env.CF_ENABLED == 'true' }}
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"

      - name: Open an issue when the scheduled publish fails
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "Scheduled publish failed in:title" --json number --jq 'length')
          if [ "$open" = "0" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Scheduled publish failed" \
              --body "The daily build of main failed, so scheduled posts are not going out. Run: $RUN_URL"
          else
            echo "An open issue already tracks this."
          fi

  close_preview:
    name: Close PR preview
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SWA_ENABLED: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN != '' }}
    steps:
      - name: Close preview environment
        if: env.SWA_ENABLED == 'true'
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
          app_location: dist-swa

  keepalive:
    # GitHub disables scheduled workflows in public repos after 60 days without repository activity.
    # Re-enabling the workflow from its own scheduled run resets that clock.
    name: Keep the schedule alive
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/site.yml/enable"
